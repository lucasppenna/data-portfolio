version: 2

models:
  - name: stg_orders
    description: "Staging layer for the raw orders table: explicit column contract; dates cast from VARCHAR to TIMESTAMP via try_cast (confirmed via typeof)."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique
      - name: order_status
        description: "Order status in the Olist flow. Values declared from a distinct on the source (2026-10-31)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']